name: Build Islamic Life APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'IslamicLifeApp_Corrected_Project.zip'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Android project ZIP
        run: |
          test -f IslamicLifeApp_Corrected_Project.zip || { echo 'Upload IslamicLifeApp_Corrected_Project.zip to repository root first'; exit 1; }
          mkdir -p /tmp/islamic-project
          unzip -q IslamicLifeApp_Corrected_Project.zip -d /tmp/islamic-project
          cp -a /tmp/islamic-project/. .
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IslamicLifeApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
